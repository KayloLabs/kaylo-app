name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/generated

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
