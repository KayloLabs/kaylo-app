name: kaylo_partner
description: "Kaylo Partner: the app workers use to receive, accept and complete Kaylo bookings."
publish_to: 'none'
# Member of the pub workspace at the repository root; run `flutter pub get`
# there (or here, which resolves the whole workspace).
resolution: workspace

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared with the customer app: models, Supabase, device services, theme
  # and widgets.
  kaylo_core:
    path: ../../packages/kaylo_core
  kaylo_ui:
    path: ../../packages/kaylo_ui

  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  intl: ^0.20.2
  device_preview: ^1.3.1
  flutter_svg: ^2.3.0
  file_picker: ^13.1.0
  http: ^1.6.0
  flutter_local_notifications: ^19.5.0
  supabase_flutter: ^2.17.2

  # Firebase: listed here as well as in kaylo_core so the FlutterFire CLI
  # wires the native plugins for this app.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  firebase_auth_mocks: ^0.15.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets_kaylo/

# Launcher icons for Android, iOS and web are generated from the files in
# assets_kaylo/launcher (the mark in white with a mustard dot on brand
# green). Regenerate after changing them:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets_kaylo/launcher/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets_kaylo/launcher/icon_background.png"
  adaptive_icon_foreground: "assets_kaylo/launcher/icon_foreground.png"
  adaptive_icon_monochrome: "assets_kaylo/launcher/icon_monochrome.png"
  web:
    generate: true
    image_path: "assets_kaylo/launcher/icon.png"
    background_color: "#1F5638"
    theme_color: "#1F5638"
