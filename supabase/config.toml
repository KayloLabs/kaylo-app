# Supabase CLI settings for this project. Only what differs from the
# defaults is listed; the CLI fills in the rest.
project_id = "jeiwfvnkxubykrzjzktm"

# The app signs in through Firebase, so requests carry a Firebase token,
# not a Supabase one. The gateway's own JWT check would reject it, so
# each function checks the caller itself: it reads the booking through
# PostgREST with the caller's token, and row-level security only returns
# the customer's own booking.
[functions.create-order]
verify_jwt = false

[functions.verify-payment]
verify_jwt = false

[functions.email-otp]
verify_jwt = false

[functions.booking-email]
verify_jwt = false

# These two also read the caller's identity themselves: care-call checks
# Google's signature on the Firebase token, delete-account lets the
# database derive the account from it.
[functions.care-call]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

# Public application uploads verify a per-application expiring bearer token.
[functions.worker-application-documents]
verify_jwt = false
